name: Integration Tests

# Integration tests spawn real sf.py subprocesses, start a web server, and make
# live network calls, so they are inherently non-deterministic across runners.
# They are intentionally run OUTSIDE the pull-request gate (no pull_request
# trigger) so their flakiness never blocks a merge. PR mergeability is gated by
# the deterministic unit suite in tests.yaml. These run on pushes to master, on
# a weekly schedule, and on demand via the Actions tab.

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist pytest-mock pytest-cov responses
      - name: Run integration tests
        run: |
          # test/integration/modules/ require external API keys / live services
          # and are excluded here (most self-skip without keys anyway).
          python -m pytest test/integration --ignore=test/integration/modules/ --durations=10
