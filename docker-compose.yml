version: "3"

# Basic usage:
#     $ docker-compose up
#
# Dev environment (code directory mapped into container):
#     $ docker-compose -f docker-compose.yml -f docker-compose-dev.yml up
#
# Full image (all CLI tools installed):
#     $ docker-compose -f docker-compose.yml -f docker-compose-full.yml up
#
# Floodplain data resides in a Docker volume
#
#     $ ls -lh /var/lib/docker/volumes/floodplain_spiderfoot-data/_data
#       total 104K
#       drwx------ 2 user user 4.0K Sep 22 09:51 cache
#       -rw-r--r-- 1 user user 100K Sep 22 15:19 floodplain.db
#
# Volumes created before the rename keep spiderfoot.db / spiderfoot.key /
# spiderfoot.crt; Floodplain keeps using those legacy names automatically.

services:
  floodplain:
    build:
      context: ./
    volumes:
      - spiderfoot-data:/var/lib/floodplain
    image: floodplain
    container_name: floodplain
    environment:
      # The container must listen on its network interface for port publishing;
      # this explicit development override is safe only with the loopback bind below.
      FLOODPLAIN_INSECURE_LISTEN: "1"
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped

volumes:
  # Volume name kept as-is so existing deployments retain their scan data.
  spiderfoot-data:
